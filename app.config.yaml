application:
  runtimeManifest:
    packages:
      exd-accelerator:
        license: Apache-2.0
        actions:
          mcp:
            function: actions/mcp/index.js
            web: 'yes'
            runtime: nodejs:22
            annotations:
              # Header-based per-user Adobe credentials — auth handled inside the MCP tools.
              # Adobe's docs recommend true for actions calling Adobe APIs; setting false here
              # is a deliberate choice mirroring the Vercel deploy. Revisit if/when this MCP
              # is refactored to use the caller's IMS token instead of client_credentials.
              require-adobe-auth: false
              # Let the framework parse JSON bodies before invoking the action.
              raw-http: false
              final: true
            limits:
              # Match Vercel's 60s function timeout. I/O Runtime action cap is also ~60s.
              timeout: 60000
              memory: 512
